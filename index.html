<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="./src/css/style.css" rel="stylesheet" type="text/css">
    <link href="https://meyerweb.com/eric/tools/css/reset/reset.css" rel="stylesheet" type="text/css">
</head>
<body>
    <header>
        <h1 class="header__h1">DFC Customer Profile</h1>
    <!-- place navbar here -->
    </header>
    <main class="main">
        <form action="#" enctype="multipart/form-data" methpd="post" name="google">
            <label for="bssc">Business card here</label>
            <input type="file" onchange="readURL(this)" accept="image/*" targetID="bssc" name="upload-picture"/><br>
            <img id="bssc" class="from__img"><br>
            <label for="start">Start date:</label>
            <input type="datetime-local" id="start" value="2018-07-22T00:00" min="2018-01-01T00:00" max="2023-12-31T00:00" name="trip-start"><br>
            <label for="company">Company:</label>
            <input type="text" id="company" name="company"><br>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name"><br>
            <input type="submit" name="send" value="送出">
        </form>
    </main>
    <footer>
    <!-- place footer here -->
    </footer>
    <script type="text/javascript">
        //照片預視
        function readURL(input){
        
        if(input.files && input.files[0]){

        var imageTagID = input.getAttribute("targetID");

        var reader = new FileReader();

        reader.onload = function (e) {

            var img = document.getElementById(imageTagID);

            img.setAttribute("src", e.target.result)

        }

        reader.readAsDataURL(input.files[0]);

        }

        }

        const scriptURL='https://script.google.com/macros/library/d/1Luk-nKv4E652v3-ncMlYy9tyEY79EZC0U4T2_hw4OX0MH-sSTcGBFiVR/1'
        const form = document.forms['google']
          
          form.addEventListener('submit', e => {
            e.preventDefault()
            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
              .then(response => alert("上傳成功"))
              .catch(error => console.error('Error!', error.message))
          })
    </script>
</body>
</html>
