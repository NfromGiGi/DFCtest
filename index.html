<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="./src/css/style.css" rel="stylesheet" type="text/css">
    <link href="https://meyerweb.com/eric/tools/css/reset/reset.css" rel="stylesheet" type="text/css">
</head>
<body>
    <header>
        <h1 class="header__h1">DFC Customer Profile</h1>
    <!-- place navbar here -->
    </header>
    <main class="main">
        <form action="https://script.google.com/macros/s/AKfycbx1pJRBnTtUVj0x91eGDLlCFXlnuZl2OzPHhV1F_jLuJR6DcMCCPShW5s-KZe0FL5A/exec" method="post">
            <label for="bssc">Business card here</label>
            <input type="file" onchange="readURL(this)" accept="image/*" targetID="bssc" name="Picture" placeholder="picture" required/><br>
            <img id="bssc" class="from__img"><br>
            <label for="start">Start date:</label>
            <input type="datetime-local" id="start" value="2018-07-22T00:00" min="2018-01-01T00:00" max="2023-12-31T00:00" name="ChooseDate" placeholder="ChooseDate" required><br>
            <label for="company">Company:</label>
            <input type="text" id="company" name="Company" placeholder="company" required><br>
            <label for="name">Name:</label>
            <input type="text" id="name" name="Name" placeholder="name" required><br>
            <button type="submit" id="google">Send</button>
        </form>
    </main>
    <footer>
    <!-- place footer here -->
    </footer>
    <script type="text/javascript">
        //照片預視
        function readURL(input){
        
        if(input.files && input.files[0]){

        var imageTagID = input.getAttribute("targetID");

        var reader = new FileReader();

        reader.onload = function (e) {

            var img = document.getElementById(imageTagID);

            img.setAttribute("src", e.target.result)

        }

        reader.readAsDataURL(input.files[0]);

        }

        }

        const element = document.querySelector('#google');
    element.addEventListener('click', onClick) // 設置為點擊之後呼叫函式
    function onClick() {
      alert('上傳成功')
      location.reload()
    }

    </script>
</body>
</html>
